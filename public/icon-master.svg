<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#7FB4FF"/>
      <stop offset="100%" stop-color="#3D6FE0"/>
    </linearGradient>
    <radialGradient id="highlight" cx="30%" cy="18%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="1.4" stdDeviation="1.6" flood-color="#1B3A78" flood-opacity="0.22"/>
    </filter>
    <clipPath id="pageClip">
      <rect x="15" y="18" width="34" height="29" rx="9"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="64" height="64" fill="url(#bg)"/>
  <rect x="0" y="0" width="64" height="64" fill="url(#highlight)"/>

  <g filter="url(#softShadow)">
    <rect x="22.5" y="14" width="4" height="8" rx="2" fill="#4E7FE8"/>
    <rect x="37.5" y="14" width="4" height="8" rx="2" fill="#4E7FE8"/>
    <rect x="15" y="18" width="34" height="29" rx="9" fill="#FFFFFF"/>
    <g clip-path="url(#pageClip)">
      <rect x="15" y="18" width="34" height="11" fill="#5C90F5"/>
    </g>
    <circle cx="32" cy="36.5" r="6.5" fill="#3D6FE0"/>
  </g>
</svg>
